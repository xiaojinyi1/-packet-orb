<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Packet Orb — 把 traceroute 变成可驾驶的 3D 网络迷宫</title>
    <meta
      name="description"
      content="Packet Orb 把一段 traceroute 结果变成可驾驶的 low-poly 3D 迷宫：延迟是坡度、丢包是坑洞、抖动是蹦床、匿名跳是迷雾隧道。纯前端、零后端，支持粘贴原始 traceroute / tracert / mtr 输出。"
    />
    <meta name="theme-color" content="#161233" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%232ed3c6'/%3E%3Ccircle cx='12' cy='11' r='4' fill='%23bffff7'/%3E%3C/svg%3E"
    />
    <meta name="author" content="Packet Orb" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Packet Orb" />
    <meta property="og:title" content="Packet Orb — 把 traceroute 变成可驾驶的 3D 网络迷宫" />
    <meta
      property="og:description"
      content="延迟是坡度，丢包是坑洞，抖动是蹦床，匿名跳是迷雾隧道。粘贴 traceroute，几秒内得到一条能开的迷宫。"
    />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Packet Orb 的 3D 迷宫：青色数据包球行驶在一条带坡度的城市道路上"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Packet Orb — 把 traceroute 变成可驾驶的 3D 迷宫" />
    <meta
      name="twitter:description"
      content="延迟是坡度，丢包是坑洞，抖动是蹦床，匿名跳是迷雾隧道。纯前端，粘贴即可生成。"
    />
    <meta name="twitter:image" content="./og.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #161233;
        color: #d9d2c5;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: radial-gradient(circle at 50% 42%, #241a4d 0%, #161233 62%);
        pointer-events: none;
        transition: opacity 320ms ease;
        z-index: 50;
      }
      #boot[data-ready='true'] {
        opacity: 0;
      }
      .po-boot-ball {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 30%, #bffff7 0%, #2ed3c6 46%, #14867f 100%);
        box-shadow: 0 0 22px rgba(46, 211, 198, 0.55);
        animation: po-drop 1.55s cubic-bezier(0.5, 0.05, 0.6, 1) both;
      }
      .po-boot-title {
        font-size: 13px;
        letter-spacing: 0.42em;
        color: #2ed3c6;
        text-transform: uppercase;
        margin-top: 6px;
      }
      .po-boot-sub {
        font-size: 11px;
        letter-spacing: 0.14em;
        color: #8f86ff;
        opacity: 0.85;
      }
      .po-boot-status {
        font-size: 10px;
        letter-spacing: 0.16em;
        color: rgba(217, 210, 197, 0.55);
        margin-top: 8px;
      }
      @keyframes po-drop {
        0% {
          transform: translateY(-120px) scaleY(0.86);
          opacity: 0;
        }
        12% {
          opacity: 1;
        }
        38% {
          transform: translateY(0) scaleY(0.72) scaleX(1.16);
        }
        52% {
          transform: translateY(-34px) scaleY(1.04) scaleX(0.98);
        }
        68% {
          transform: translateY(0) scaleY(0.8) scaleX(1.1);
        }
        80% {
          transform: translateY(-12px) scaleY(0.98);
        }
        92% {
          transform: translateY(0) scaleY(0.94);
        }
        100% {
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .po-boot-ball {
          animation: none;
        }
        #boot {
          transition: none;
        }
      }
      .po-tweakpane {
        position: fixed;
        top: 12px;
        right: 12px;
        width: 272px;
        z-index: 20;
      }
      .po-tweakpane .tp-dfwv {
        width: 272px;
      }
      .po-perf {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 20;
        padding: 6px 9px;
        font-size: 11px;
        line-height: 1.5;
        color: #2ed3c6;
        background: rgba(22, 18, 51, 0.72);
        border: 1px solid rgba(46, 211, 198, 0.28);
        border-radius: 3px;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" aria-live="polite">
      <div class="po-boot-ball" aria-hidden="true"></div>
      <div class="po-boot-title">Packet Orb</div>
      <div class="po-boot-sub">traceroute → 可驾驶迷宫</div>
      <div class="po-boot-status">booting physics worker…</div>
    </div>
    <noscript>Packet Orb 需要 JavaScript 与 WebGL；浏览器无法自行执行 traceroute，请粘贴已有输出。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
